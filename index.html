<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{name}} · Memorize every flag of the world</title>
    <meta name="description" content="{{description}}">
    <link rel="canonical" href="{{siteUrl}}">
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{name}}">
    <meta property="og:title" content="{{name}} · {{tagline}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{siteUrl}}">
    <meta property="og:image" content="{{siteUrl}}og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A grid of world flags with the words Learn the Flags">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{name}} · {{tagline}}">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{siteUrl}}og.png">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "{{name}}",
        "url": "{{siteUrl}}",
        "description": "{{description}}",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      try {
        const t = JSON.parse(localStorage.getItem('learn-the-flags:v1') || '{}').settings?.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="logo" href="#/" aria-label="{{name}} home">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="5" y="3" width="2.5" height="26" rx="1.25" fill="currentColor"/><path d="M8.5 5h17l-3.5 5.5 3.5 5.5h-17z" fill="var(--accent)"/></svg>
          <span>{{name}}</span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="#/">Learn</a>
          <a href="#/browse">All flags</a>
          <a href="#/progress">Progress</a>
          <a href="#/settings" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </a>
        </nav>
      </div>
    </header>

    <main id="app" class="wrap">
      <noscript>
        <h1>{{name}}</h1>
        <p>{{description}}</p>
        <p>This learning app needs JavaScript. You can still <a href="flags/">browse every flag of the world</a>.</p>
      </noscript>
    </main>

    <footer class="site-footer wrap">
      <p>{{name}} is a free tool for memorizing the flags of all 193 UN member states plus Vatican City and Palestine. <a href="flags/">Flag index</a></p>
      <p class="muted">Flag images from Wikimedia Commons via flagcdn.com (public domain).</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
